name: Source release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  source:
    name: Publish source release
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Package tagged source and checksums
        run: python tools/package-source.py --ref "$GITHUB_SHA" --tag "$RELEASE_TAG"
      - name: Publish tagged source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" artifacts/releases/*.zip artifacts/releases/*.sha256 --clobber
          else
            gh release create "$RELEASE_TAG" artifacts/releases/*.zip artifacts/releases/*.sha256 \
              --verify-tag --title "Kinakaze $RELEASE_TAG" \
              --notes-file "docs/releases/$RELEASE_TAG.md"
          fi

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish Windows runtime and source
    needs: checks
    # Native IoRing APIs are unavailable on Server 2022. Packaging loads the
    # providers and runs guest I/O tests, so use a supported runtime host.
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Set up MSVC, Rust and LLVM
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $installation = (& $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath).Trim()
          if (-not $installation) { throw 'MSVC Build Tools were not found.' }
          $previousPath = $env:PATH -split ';'
          Import-Module (Join-Path $installation 'Common7/Tools/Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $installation -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          foreach ($entry in ($env:PATH -split ';')) {
            if ($entry -and $previousPath -notcontains $entry) {
              $entry | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            }
          }
          foreach ($name in @('INCLUDE', 'LIB', 'LIBPATH', 'VCToolsInstallDir', 'VCToolsRedistDir', 'VCINSTALLDIR', 'VSINSTALLDIR', 'WindowsSdkDir', 'WindowsSDKVersion', 'WindowsLibPath', 'UniversalCRTSdkDir', 'UCRTVersion')) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ($value) { "$name=$value" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append }
          }
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup override set 1.95.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          (Join-Path $env:ProgramFiles 'LLVM/bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Package tagged source and checksums
        run: python tools/package-source.py --ref "$env:GITHUB_SHA" --tag "$env:RELEASE_TAG"
      - name: Build release with default online Debian manifest
        run: ./tools/build.ps1 -Release -DistDirectory artifacts/runtime
      - name: Verify first launch using only distribution files
        run: python tools/test-release-runtime.py --dist artifacts/runtime --report artifacts/runtime-validation.json --cache target/rootfs-downloads
      - name: Package Windows runtime and checksums
        run: python tools/package-runtime.py --dist artifacts/runtime --report artifacts/runtime-validation.json
      - name: Verify extracted runtime ZIP
        run: |
          $archive = Get-ChildItem artifacts/releases/*-windows-x86_64.zip | Select-Object -ExpandProperty FullName
          python tools/test-release-runtime.py --archive $archive --cache target/rootfs-downloads
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish runtime and source together
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem artifacts/releases/*.zip, artifacts/releases/*.sha256 | Select-Object -ExpandProperty FullName
          gh release view "$env:RELEASE_TAG" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:RELEASE_TAG" @assets --clobber
          } else {
            gh release create "$env:RELEASE_TAG" @assets --verify-tag --title "Kinakaze $env:RELEASE_TAG" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

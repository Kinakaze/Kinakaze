<!doctype html>
<html><head><meta charset="utf-8"><title>Kinakaze browser boundary test</title>
<style>html,body{margin:0;background:#000;color:white}h1{margin:100px 40px}</style>
</head><body><h1 id="result">WAIT</h1><script>
try {
  function check(value, name) { if (!value) throw new Error(name); }
  const text = '浏览器 UTF-8 😀';
  check(new TextDecoder().decode(new TextEncoder().encode(text)) === text, 'UTF-8');
  const buffer = new ArrayBuffer(16), view = new DataView(buffer);
  view.setUint32(3, 0x12345678, true);
  check(view.getUint32(3, true) === 0x12345678, 'unaligned DataView');
  const objects = Array.from({length: 4096}, (_, i) => ({n: 4095 - i, s: String(i)}));
  objects.sort((a, b) => a.n - b.n);
  check(JSON.parse(JSON.stringify(objects))[2048].n === 2048, 'sort and JSON');
  const code = new Uint8Array([0,97,115,109,1,0,0,0,1,7,1,96,2,127,127,1,127,
    3,2,1,0,7,7,1,3,97,100,100,0,0,10,9,1,7,0,32,0,32,1,106,11]);
  const answer = new WebAssembly.Instance(new WebAssembly.Module(code)).exports.add(20, 22);
  check(answer === 42, 'WebAssembly');
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = 64;
  const context = canvas.getContext('2d');
  context.fillStyle = '#193b57'; context.fillRect(0, 0, 64, 64);
  const pixel = context.getImageData(10, 10, 1, 1).data;
  check(pixel[0] === 25 && pixel[1] === 59 && pixel[2] === 87 && pixel[3] === 255, 'canvas pixels');
  check(canvas.toDataURL('image/png').startsWith('data:image/png;base64,'), 'PNG encoding');
  localStorage.setItem('kinakaze-probe', text);
  check(localStorage.getItem('kinakaze-probe') === text, 'localStorage');
  localStorage.removeItem('kinakaze-probe');
  const button = document.createElement('button'); let clicks = 0;
  button.addEventListener('click', () => clicks++);
  button.dispatchEvent(new MouseEvent('click', {bubbles: true}));
  check(clicks === 1, 'DOM events');
  document.getElementById('result').textContent = 'KINAKAZE_BROWSER_JS_' + answer;
  document.documentElement.style.background = document.body.style.background = '#193b57';
  document.title = 'PASS: UTF-8, typed arrays, sort, JSON, Wasm, canvas, storage, events';
} catch (error) {
  document.getElementById('result').textContent = 'BROWSER_PROBE_FAILED: ' + error;
  document.documentElement.style.background = document.body.style.background = '#790000';
  document.title = 'FAIL: ' + error;
}
</script></body></html>
